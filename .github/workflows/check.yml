name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - run: python scripts/reproduce.py check
      - run: python scripts/reproduce.py test
      - run: python scripts/reproduce.py demo
      - run: python scripts/reproduce.py figures
