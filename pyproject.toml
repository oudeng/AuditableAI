[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditableai-thesis"
version = "1.0.0rc1"
description = "Claim-centered auditing, application experiments and evidence reproduction for Auditable AI in Human Sciences"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Ou Deng"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11,<2", "scikit-learn==1.7.2", "matplotlib>=3.8,<4", "seaborn==0.13.2", "openpyxl==3.1.5"]

[tool.setuptools.packages.find]
where = ["src"]
